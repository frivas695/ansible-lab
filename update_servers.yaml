---
- name: Update and reboot servers in inventory
  hosts: all
  become: true
  gather_facts: true

  tasks:
    # ==========================================================
    # Debian/Ubuntu Updates
    # ==========================================================
    - name: Update apt repo and cache on all Debian/Ubuntu boxes
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Upgrade all apt packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: yes
      when: ansible_os_family == "Debian"

    - name: Check if a reboot is required (Debian/Ubuntu)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_os_family == "Debian"

    # ==========================================================
    # RedHat/CentOS/Rocky/Alma Updates
    # ==========================================================
    - name: Upgrade all dnf packages (RedHat/CentOS/Rocky/Alma)
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: yes
      when: ansible_os_family == "RedHat"

    - name: Check if a reboot is required (RedHat/CentOS/Rocky/Alma)
      ansible.builtin.command: needs-restarting -r
      register: reboot_required_redhat
      failed_when: false
      changed_when: reboot_required_redhat.rc == 1
      when: ansible_os_family == "RedHat"

    # ==========================================================
    # Reboot Logic
    # ==========================================================
    - name: Reboot the server if kernel was updated
      ansible.builtin.reboot:
        msg: "Reboot initiated by Ansible for OS updates"
        connect_timeout: 5
        reboot_timeout: 600
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: >
        (ansible_os_family == "Debian" and reboot_required_file.stat.exists) or
        (ansible_os_family == "RedHat" and reboot_required_redhat.rc == 1)

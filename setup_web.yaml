
- name: Configure Backend Web Servers
  hosts: web_servers
  become: yes
  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Create custom index page to identify the server
      copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Hello from {{ ansible_facts['hostname'] }}</h1>
          <p>Served by Nginx</p>

    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

